name: Production health check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check public API and database
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 https://confeiti.com.br/api/health)"
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"database":"ok"'

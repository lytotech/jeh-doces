name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/confeiti
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run API smoke tests
        run: npm run test:smoke -w @jeh-doces/api
      - name: Run billing tests
        run: npm run test:billing -w @jeh-doces/api
      - name: Run webhook tests
        run: npm run test:webhook -w @jeh-doces/api
      - name: Run payment tests
        run: npm run test:payment -w @jeh-doces/api
